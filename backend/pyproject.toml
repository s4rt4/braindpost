[project]
name = "braindpost-backend"
version = "0.1.0"
description = "Braindpost AI content assistant backend"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "sqlalchemy>=2.0",
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
    "httpx>=0.27",
    "python-dotenv>=1.0",
    "pillow>=10.4",
    "python-multipart>=0.0.20",
]

[dependency-groups]
dev = []
